# Publish all `io.github.kuiralabs:*` modules to Maven Central (Central Portal)
# on a version tag (e.g. `v0.1.0-alpha01`).
#
# Required GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   MAVEN_CENTRAL_USERNAME             — Central Portal user-token username
#   MAVEN_CENTRAL_PASSWORD             — Central Portal user-token password
#   SIGNING_IN_MEMORY_KEY              — ASCII-armored GPG private key (whole
#                                        -----BEGIN PGP PRIVATE KEY BLOCK----- block)
#   SIGNING_IN_MEMORY_KEY_PASSWORD     — GPG passphrase
#
# Tagging strategy: `git tag v<version> && git push --tags` ships that version.
# The vanniktech `publishToMavenCentral` task uploads to Central Portal STAGING;
# release-to-public is a manual step on the Portal (safer than auto-release for
# the alpha — gives a chance to inspect the bundle before it goes live).

name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # manual trigger for first-time setup / dry-run

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (recursive — kuira-crypto-ffi submodule supplies the Rust source)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Rust (Android cross-compilation targets for the FFI .so libs)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (fail-fast before publishing)
        run: ./gradlew test --console=plain

      - name: Publish to mavenLocal (acceptance prereq)
        run: ./gradlew publishToMavenLocal --console=plain

      - name: Acceptance — BBoard builds against the alpha as a third-party consumer
        working-directory: examples/bboard
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Publish to Maven Central staging
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --console=plain --no-configuration-cache
