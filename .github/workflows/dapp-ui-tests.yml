name: dapp-ui tests

# Runs the dapp-ui module's regression suite + a BBoard smoke build on
# every PR and main-branch push. Block on red — these tests guard the
# bug classes documented in sdk/dapp-ui/CHANGELOG.md (master-key
# generation on restore, dismissBackup durability, atomic seed write,
# init-probe state machine). A red build here means a regression in
# the same neighborhood that broke users in the wallet's pre-1.0 arc.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a newer commit lands on the same ref —
# keeps the queue fast and CI minutes cheap.
concurrency:
  group: dapp-ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (dapp-ui + core:auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Submodule pinning for examples/midnight-kicks — we don't run
          # Kicks tests in this workflow, but the submodule pointer
          # check still wants the .git pointer resolvable.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run dapp-ui unit tests
        run: ./gradlew :sdk:dapp-ui:testDebugUnitTest

      - name: Run core:auth unit tests
        run: ./gradlew :core:auth:testDebugUnitTest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            sdk/dapp-ui/build/reports/tests/
            core/auth/build/reports/tests/
          retention-days: 7

  bboard-smoke:
    name: BBoard consumer smoke build
    runs-on: ubuntu-latest
    # Run in parallel with unit-tests — they don't share artifacts in
    # this workflow (BBoard consumes mavenLocal, so it builds its own
    # SDK). Faster total wall-clock.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # BBoard consumes Kuira via Maven coordinates, so the SDK has to
      # be present in the local Maven repo before BBoard's Gradle
      # invocation looks for it. Publishing from the parent project's
      # root build does the right thing.
      - name: Publish Kuira SDK to mavenLocal
        run: ./gradlew publishToMavenLocal

      - name: Build BBoard example
        working-directory: examples/bboard
        run: ./gradlew :app:assembleDebug
