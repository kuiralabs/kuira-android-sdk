name: dapp-ui tests

# Runs the dapp-ui module's regression suite on every PR and main-branch
# push. Block on red — these tests guard the bug classes documented in
# sdk/dapp-ui/CHANGELOG.md (master-key generation on restore,
# dismissBackup durability, atomic seed write, init-probe state
# machine). A red build here means a regression in the same
# neighborhood that broke users in the wallet's pre-1.0 arc.
#
# **Submodule note:** `examples/midnight-kicks` and `kuira-crypto-ffi`
# are declared in `.gitmodules` but kept PRIVATE on GitHub. The default
# `GITHUB_TOKEN` provided to actions/checkout only has read access to
# this repo, not to the submodule repos, so submodule recursion would
# fail with a 401. We `submodules: false` here and run only the
# unit-test jobs that don't need the submodule source — currently
# `:sdk:dapp-ui:testDebugUnitTest` + `:core:auth:testDebugUnitTest`
# which are JVM-only and don't pull in the native FFI from
# kuira-crypto-ffi.
#
# To re-enable the BBoard consumer smoke build (or future Kicks tests),
# either make the submodule repos public, or add a Personal Access
# Token secret with `repo` scope and pass it as
# `token: ${{ secrets.SUBMODULE_PAT }}` in actions/checkout.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a newer commit lands on the same ref —
# keeps the queue fast and CI minutes cheap.
concurrency:
  group: dapp-ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (dapp-ui + core:auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `submodules: false` — see submodule note in the header
          # comment. Re-enable once submodule access is wired up.
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run dapp-ui unit tests
        run: ./gradlew :sdk:dapp-ui:testDebugUnitTest

      - name: Run core:auth unit tests
        run: ./gradlew :core:auth:testDebugUnitTest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            sdk/dapp-ui/build/reports/tests/
            core/auth/build/reports/tests/
          retention-days: 7
