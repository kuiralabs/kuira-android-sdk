# Verifies the native FFI (kuira-crypto-ffi) cross-compiles and PACKAGES for every
# shipped Android ABI — specifically that x86_64 ships, so device-less devs can run
# the SDK on an Intel emulator (issue #45).
#
# This is a BUILD gate, NOT a runtime one: it does not boot an emulator or run
# instrumented tests. An Android x86_64 .so can't load on the Linux CI host anyway,
# and a full x86 emulator on CI buys little over proving the lib builds + packages.
# Runtime validation on a real x86 emulator is left to a dev on x86 hardware / the
# example repos' own CI.

name: Native ABI build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs when a newer commit lands on the same ref.
concurrency:
  group: native-abi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-abi:
    name: Cross-compile FFI + package .so (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (recursive — kuira-crypto-ffi submodule supplies the Rust source)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Rust (Android cross-compilation targets for the FFI .so libs)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo build (FFI + blst/ring/midnight-ledger deps)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kuira-crypto-ffi

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Cross-compile the Rust FFI for every shipped ABI
        # Produces target/<abi>/release/libkuira_crypto_ffi.a for arm64-v8a + x86_64.
        # A failure here means the FFI (or a dep: blst/BLS, ring) doesn't build for that ABI.
        run: ./kuira-crypto-ffi/build-android.sh release

      - name: Link each ABI's .a into a packaged .so (core:crypto CMake)
        run: ./gradlew :core:crypto:assembleDebug --console=plain

      - name: Assert the x86_64 .so is packaged and is a genuine x86-64 ELF
        # The point of #45: the AAR must ship an x86_64 lib so an Intel emulator can load
        # it. Fail loudly if a build / abiFilters change ever drops it or mis-copies arm64.
        run: |
          set -euo pipefail
          so=$(find core/crypto/build -name libkuira_crypto_ffi.so -path '*x86_64*' | head -1)
          if [ -z "$so" ]; then
            echo "::error::x86_64 libkuira_crypto_ffi.so missing — x86_64 ABI not packaged"
            find core/crypto/build -name 'libkuira_crypto_ffi.so' || true
            exit 1
          fi
          echo "x86_64 .so: $so"
          file "$so"
          file "$so" | grep -q 'x86-64' || { echo "::error::packaged .so is not an x86-64 ELF"; exit 1; }
          echo "x86_64 native lib builds and packages cleanly."
